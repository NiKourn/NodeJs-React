services:
  backend:
    build:
      context: ./nodejs-backend
    container_name: nodejs-srv
    ports:
      - '5500:5500'
    volumes:
      - ./nodejs-backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_USER: test@example.com
      EMAIL_PASS: password
      PORT: 5500
    command: ['npm', 'run', 'dev']
    depends_on:
      - mongodb
      - mailhog
    networks:
      - app-network

  frontend:
    build:
      context: ./react-frontend
    container_name: react-app
    ports:
      - '3000:3000'
    volumes:
      - ./react-frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
    command: ['npm', 'start']
    depends_on:
      - backend
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb-srv
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - ./mongoData/db:/data/db
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - '8025:8025' # MailHog UI
      - '1025:1025' # SMTP Port
    networks:
      - app-network
    depends_on:
      - mongodb

volumes:
  mongodb-data:

networks:
  app-network:
    driver: bridge
